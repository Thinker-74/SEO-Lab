name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-7-4:
    name: PHP 7.4.33 (gate locale)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, uninstall, suite S0-S4 e fixture 01-10
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            -v "$PWD:/work:ro" -w /work \
            php:7.4.33-cli@sha256:691f9ae2a3639de11d95f507bc29c723a7f27b79bdf91317aef8ded35f9864ce \
            bash tests/run-ci.sh

  php-8-3:
    name: PHP 8.3.6 (gate locale)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint, uninstall, suite S0-S4 e fixture 01-10
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            -v "$PWD:/work:ro" -w /work \
            php:8.3.6-cli@sha256:9ed77294c3332080ebcd2f6b9a2d390565eaa4a05fc26aefff62aa9b0af9b5e9 \
            bash tests/run-ci.sh

  package:
    name: Pacchetto ZIP e checksum
    needs: [php-7-4, php-8-3]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build riproducibile e controllo manifest, licenza, dipendenze e segreti
        run: |
          mkdir -p dist
          python3 tests/s5-release-symlink.py
          python3 scripts/build-release.py --output dist/seo-lab.zip
          python3 -m zipfile -t dist/seo-lab.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seo-lab-zip
          path: dist/
          if-no-files-found: error
